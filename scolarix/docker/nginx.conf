server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Taille maximale des envois (photos 2 Mo, imports CSV 2 Mo)
  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # API (Express) : génération PDF et emplois du temps peuvent prendre quelques secondes
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Fichiers du site, mis en cache longtemps (noms versionnés par Vite)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toutes les autres adresses renvoient index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
