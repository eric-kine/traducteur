# ─────────────────────────────────────────────────────────────
#  Déploiement Scolarix (base + API + site)
#    cp .env.production.example .env.production   # puis remplir
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scolarix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env.production}
      POSTGRES_DB: scolarix
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scolarix -d scolarix"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://scolarix:${POSTGRES_PASSWORD}@db:5432/scolarix
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Définissez JWT_ACCESS_SECRET (48 caractères aléatoires)}
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Définissez PUBLIC_APP_URL (adresse publique du site)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@scolarix.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Définissez SEED_ADMIN_PASSWORD}
    volumes:
      - uploads:/data/uploads

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db-data:
  uploads:
