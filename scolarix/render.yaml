# ─────────────────────────────────────────────────────────────
#  Blueprint Render pour Scolarix
#  Render → New + → Blueprint → dépôt eric-kine/traducteur
#        → « Blueprint Path » : scolarix/render.yaml
#  Crée : une base PostgreSQL + un service web (API + site, une seule adresse).
# ─────────────────────────────────────────────────────────────
databases:
  - name: scolarix-db
    databaseName: scolarix
    user: scolarix
    # free : gratuit mais SUPPRIMÉE au bout de 30 jours → passez à « basic-256mb » pour un usage réel
    plan: free

services:
  - type: web
    name: scolarix
    runtime: docker
    rootDir: scolarix
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # free : s'endort après 15 min d'inactivité (≈ 1 min pour se réveiller) ;
    # « starter » recommandé pour un usage réel (toujours actif, plus de mémoire pour les PDF)
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scolarix-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true          # secret fort généré par Render
      - key: SEED_ADMIN_EMAIL
        sync: false                  # demandé à la création : email du 1er administrateur
      - key: SEED_ADMIN_PASSWORD
        sync: false                  # demandé à la création : son mot de passe (8 caractères, lettres + chiffres)
      - key: LOAD_DEMO_DATA
        value: "false"               # "true" = charge l'institut de démonstration au 1er démarrage
      # PUBLIC_APP_URL et CORS_ORIGIN : déduits automatiquement de l'adresse Render.
      # Avec un nom de domaine à vous, ajoutez PUBLIC_APP_URL=https://votre-domaine
    # Photos des étudiants : sur le plan gratuit, elles sont PERDUES à chaque redéploiement.
    # Pour les conserver (plan payant), décommentez ce disque persistant :
    # disk:
    #   name: uploads
    #   mountPath: /data/uploads
    #   sizeGB: 1
