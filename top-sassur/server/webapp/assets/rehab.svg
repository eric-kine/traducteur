<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Séance de rééducation">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a34"/><stop offset="1" stop-color="#4a3122"/>
    </linearGradient>
  </defs>
  <!-- floor -->
  <ellipse cx="200" cy="255" rx="150" ry="18" fill="rgba(19,74,34,.25)"/>
  <!-- mat -->
  <rect x="120" y="228" width="220" height="16" rx="8" fill="#f4faee" opacity=".9"/>
  <!-- patient lying, therapist assisting a leg raise -->
  <!-- patient body -->
  <path d="M150 232 q70 -8 150 -2" stroke="url(#sk)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="146" cy="224" r="15" fill="url(#sk)"/>
  <!-- raised leg -->
  <path d="M280 230 q30 -40 34 -78" stroke="url(#sk)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- therapist -->
  <circle cx="330" cy="120" r="18" fill="url(#sk)"/>
  <path d="M330 140 l0 55 M330 155 l-40 -8 M330 155 l26 22" stroke="url(#sk)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M330 195 l-14 44 M330 195 l16 44" stroke="#f4faee" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- helping hands near raised foot -->
  <circle cx="290" cy="147" r="8" fill="#f4d9b0"/>
  <!-- heartbeat accent -->
  <path d="M60 90 h34 l10 -22 l14 44 l10 -22 h40" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
</svg>
