services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-topsassur}
      POSTGRES_USER: ${POSTGRES_USER:-topsassur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsassur}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topsassur}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-a-remplacer}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-topsassur}
      POSTGRES_USER: ${POSTGRES_USER:-topsassur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsassur}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ADMIN_USER: ${DJANGO_ADMIN_USER:-admin}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-admin1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
  media:
